name: Docker Image Build and Push

on:
  push:
    branches: [ "master" ]

env:
  LATEST_VERSION: "8.5"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            "8.0": "8.0/**"
            "8.1": "8.1/**"
            "8.2": "8.2/**"
            "8.3": "8.3/**"
            "8.4": "8.4/**"
            "8.5": "8.5/**"

  build-and-push:
    needs: changes
    # only push images for commits that landed on master (merged PR or direct push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.changes.outputs.versions) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push image php ${{ matrix.version }}
        uses: docker/build-push-action@v4
        with:
          context: "{{defaultContext}}:${{ matrix.version }}"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: lanuma/php:${{ matrix.version }}${{ matrix.version == env.LATEST_VERSION && ',lanuma/php:latest' || '' }}
